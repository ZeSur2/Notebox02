          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/widget/NoteBoxWidget.kt
          package com.notebox.widget
          import android.content.Context
          import android.graphics.BitmapFactory
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.DpSize
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.glance.*
          import androidx.glance.action.actionStartActivity
          import androidx.glance.action.clickable
          import androidx.glance.appwidget.GlanceAppWidget
          import androidx.glance.appwidget.SizeMode
          import androidx.glance.appwidget.cornerRadius
          import androidx.glance.appwidget.provideContent
          import androidx.glance.layout.*
          import androidx.glance.text.*
          import androidx.glance.unit.ColorProvider
          import com.notebox.data.ImageStore
          import com.notebox.data.Note
          import com.notebox.data.NoteDatabase
          import com.notebox.data.Prefs
          class NoteBoxWidget : GlanceAppWidget() {
              override val sizeMode = SizeMode.Responsive(setOf(DpSize(100.dp, 100.dp), DpSize(160.dp, 100.dp), DpSize(250.dp, 100.dp), DpSize(100.dp, 200.dp), DpSize(160.dp, 200.dp), DpSize(250.dp, 200.dp), DpSize(250.dp, 280.dp), DpSize(320.dp, 280.dp)))
              override suspend fun provideGlance(context: Context, id: GlanceId) {
                  val dao = NoteDatabase.get(context).noteDao()
                  val allNotes = dao.observeAllSnapshot()
                  val pinned = allNotes.filter { it.pinned }
                  val toShow: List<Note> = when { pinned.isNotEmpty() -> pinned; allNotes.isNotEmpty() -> listOf(allNotes.first()); else -> emptyList() }
                  val globalBg = Prefs.getDefaultBg(context)
                  val globalText = Prefs.getDefaultText(context)
                  provideContent {
                      val size = LocalSize.current
                      val noteCount = when { size.height.value < 140f -> 1; size.height.value < 240f -> 2; else -> 3 }.coerceAtMost(toShow.size.coerceAtLeast(0))
                      Box(modifier = GlanceModifier.fillMaxSize().background(ColorProvider(Color(globalBg))).padding(8.dp)) {
                          Column(GlanceModifier.fillMaxSize()) {
                              if (toShow.isEmpty()) {
                                  Text("NoteBox\nno notes", style = TextStyle(fontFamily = androidx.glance.text.FontFamily.Monospace, fontSize = 13.sp, color = ColorProvider(Color(globalText))))
                              } else {
                                  toShow.take(noteCount.coerceAtLeast(1)).forEachIndexed { idx, note ->
                                      NoteBlock(context, note, globalBg, globalText, size, noteCount, idx, toShow.size)
                                      if (idx < noteCount - 1) Spacer(GlanceModifier.height(6.dp))
                                  }
                              }
                          }
                          Box(modifier = GlanceModifier.align(Alignment.TopEnd).size(24.dp).cornerRadius(12.dp).background(ColorProvider(Color(0x33FFFFFF))).clickable(actionStartActivity<WidgetEditActivity>()), contentAlignment = Alignment.Center) {
                              Text("⚙", style = TextStyle(fontSize = 12.sp, color = ColorProvider(Color(globalText))))
                          }
                      }
                  }
              }
          }
          @Composable
          private fun NoteBlock(context: Context, note: Note, globalBg: Long, globalText: Long, availableSize: DpSize, itemsInWidget: Int, index: Int, totalInWidget: Int) {
              val fg = note.customTextColor ?: globalText
              val showImage = note.imagePath != null && availableSize.width.value >= 180f && itemsInWidget == 1
              Column(modifier = GlanceModifier.fillMaxWidth().padding(vertical = 2.dp)) {
                  Text(note.title.ifBlank { "(untitled)" }, style = TextStyle(fontFamily = androidx.glance.text.FontFamily.Monospace, fontWeight = FontWeight.Bold, fontSize = 13.sp, color = ColorProvider(Color(fg))), maxLines = 1)
                  Spacer(GlanceModifier.height(2.dp))
                  Text(note.content.ifBlank { "—" }, style = TextStyle(fontFamily = androidx.glance.text.FontFamily.Monospace, fontSize = 11.sp, color = ColorProvider(Color(fg))), maxLines = if (itemsInWidget == 1) 8 else 2)
                  if (showImage && note.imagePath != null) {
                      val file = ImageStore.resolve(context, note.imagePath)
                      if (file.exists()) {
                          val bmp = BitmapFactory.decodeFile(file.absolutePath)
                          if (bmp != null) {
                              Spacer(GlanceModifier.height(4.dp))
                              Image(provider = ImageProvider(bmp), contentDescription = null, modifier = GlanceModifier.fillMaxWidth().height(70.dp).cornerRadius(6.dp), contentScale = ContentScale.Crop)
                          }
                      }
                  }
              }
          }
          EOF

