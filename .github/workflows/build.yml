          package com.notebox.widget
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.glance.appwidget.updateAll
          import androidx.lifecycle.lifecycleScope
          import com.notebox.data.Prefs
          import com.notebox.ui.ColorRowForWidget
          import com.notebox.ui.theme.NoteBoxTheme
          import kotlinx.coroutines.launch
          class WidgetEditActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var mode by remember { mutableStateOf(com.notebox.ui.theme.ThemeMode.STANDARD) }
                      LaunchedEffect(Unit) { mode = Prefs.getThemeMode(this@WidgetEditActivity) }
                      NoteBoxTheme(mode = mode) {
                          WidgetEditScreen(onClose = { finish() }, onSaved = { lifecycleScope.launch { NoteBoxWidget().updateAll(this@WidgetEditActivity); finish() } })
                      }
                  }
              }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun WidgetEditScreen(onClose: () -> Unit, onSaved: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var bg by remember { mutableStateOf(0xFF272822L) }
              var text by remember { mutableStateOf(0xFFF8F8F2L) }
              LaunchedEffect(Unit) { bg = Prefs.getDefaultBg(ctx); text = Prefs.getDefaultText(ctx) }
              Scaffold(containerColor = MaterialTheme.colorScheme.background, topBar = { TopAppBar(title = { Text("widget settings") }, actions = { TextButton(onClick = { scope.launch { Prefs.setDefaultBg(ctx, bg); Prefs.setDefaultText(ctx, text); onSaved() } }) { Text("save") } }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background)) }) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Text("background color", style = MaterialTheme.typography.titleLarge)
                      ColorRowForWidget(bg) { bg = it }
                      Text("text color", style = MaterialTheme.typography.titleLarge)
                      ColorRowForWidget(text) { text = it }
                      Text("These colors affect all NoteBox widgets. Per-note colors override these.", style = MaterialTheme.typography.labelSmall)
                      Spacer(Modifier.height(24.dp))
                  }
              }
          }
          EOF

