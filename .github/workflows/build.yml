name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Extract Source Code
        run: |
          unzip -o NoteBox2.zip -d ./project
          
      - name: Inject New Optimized Code
        run: |
          ROOT_DIR=$(find ./project -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$ROOT_DIR"
          mkdir -p app/src/main/java/com/notebox/data
          mkdir -p app/src/main/java/com/notebox/ui/theme
          mkdir -p app/src/main/java/com/notebox/ui
          mkdir -p app/src/main/java/com/notebox/widget
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/data/Note.kt
          package com.notebox.data
          import androidx.compose.runtime.Immutable
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          @Immutable
          @Entity(tableName = "notes")
          data class Note(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val title: String = "",
              val content: String = "",
              val folder: String = "Inbox",
              val imagePath: String? = null,
              val customBgColor: Long? = null,
              val customTextColor: Long? = null,
              val widgetFontScale: Float = 1.0f,
              val pinned: Boolean = false,
              val createdAt: Long = System.currentTimeMillis(),
              val updatedAt: Long = System.currentTimeMillis()
          )
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/data/NoteDao.kt
          package com.notebox.data
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow
          @Dao
          interface NoteDao {
              @Query("SELECT * FROM notes ORDER BY updatedAt DESC")
              fun observeAll(): Flow<List<Note>>
              @Query("SELECT * FROM notes ORDER BY pinned DESC, updatedAt DESC")
              suspend fun observeAllSnapshot(): List<Note>
              @Query("SELECT * FROM notes WHERE pinned = 1 ORDER BY updatedAt DESC LIMIT 1")
              suspend fun getPinned(): Note?
              @Query("SELECT * FROM notes ORDER BY updatedAt DESC LIMIT 1")
              suspend fun getLatest(): Note?
              @Query("SELECT * FROM notes WHERE id = :id")
              suspend fun getById(id: Long): Note?
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsert(note: Note): Long
              @Delete
              suspend fun delete(note: Note)
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/ui/theme/ThemeMode.kt
          package com.notebox.ui.theme
          enum class ThemeMode { STANDARD, OLED, FADE }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/ui/theme/Theme.kt
          package com.notebox.ui.theme
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          val TerminalGreen = Color(0xFFA6E22E)
          val TerminalCyan = Color(0xFF66D9EF)
          val TerminalComment = Color(0xFF75715E)
          private val DarkColors = darkColorScheme(background = Color(0xFF272822), surface = Color(0xFF1E1F1C), onBackground = Color(0xFFF8F8F2), onSurface = Color(0xFFF8F8F2), primary = TerminalGreen, secondary = TerminalCyan)
          private val OledColors = darkColorScheme(background = Color(0xFF000000), surface = Color(0xFF0A0A0A), onBackground = Color(0xFFFFFFFF), onSurface = Color(0xFFEDEDED), surfaceVariant = Color(0xFF151515), primary = Color(0xFF7CFF6B), secondary = Color(0xFF5DDFFF), outline = Color(0xFF2A2A2A))
          private val FadeColors = darkColorScheme(background = Color(0xFF1E1E2E), surface = Color(0xFF252538), onBackground = Color(0xFFCDD6F4), onSurface = Color(0xFFCDD6F4), surfaceVariant = Color(0xFF313244), primary = Color(0xFFB4BEFE), secondary = Color(0xFF89DCEB), outline = Color(0xFF45475A))
          private val LightColors = lightColorScheme(primary = Color(0xFF2E7D32), secondary = Color(0xFF00695C))
          private val Mono = FontFamily.Monospace
          private val AppTypography = Typography(bodyLarge = TextStyle(fontFamily = Mono, fontSize = 15.sp, lineHeight = 22.sp), bodyMedium = TextStyle(fontFamily = Mono, fontSize = 13.sp, lineHeight = 19.sp), titleLarge = TextStyle(fontFamily = Mono, fontWeight = FontWeight.Bold, fontSize = 20.sp), labelSmall = TextStyle(fontFamily = Mono, fontSize = 11.sp, color = TerminalComment))
          @Composable
          fun NoteBoxTheme(mode: ThemeMode = ThemeMode.STANDARD, dark: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
              val scheme = when { !dark -> LightColors; mode == ThemeMode.OLED -> OledColors; mode == ThemeMode.FADE -> FadeColors; else -> DarkColors }
              MaterialTheme(colorScheme = scheme, typography = AppTypography, content = content)
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/data/Prefs.kt
          package com.notebox.data
          import android.content.Context
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.first
          private val Context.dataStore by preferencesDataStore("notebox_prefs")
          object Prefs {
              private val DEFAULT_BG = longPreferencesKey("default_bg")
              private val DEFAULT_TEXT = longPreferencesKey("default_text")
              private val THEME_MODE = stringPreferencesKey("theme_mode")
              suspend fun getDefaultBg(ctx: Context): Long = ctx.dataStore.data.first()[DEFAULT_BG] ?: 0xFF272822
              suspend fun getDefaultText(ctx: Context): Long = ctx.dataStore.data.first()[DEFAULT_TEXT] ?: 0xFFF8F8F2
              suspend fun setDefaultBg(ctx: Context, color: Long) { ctx.dataStore.edit { it[DEFAULT_BG] = color } }
              suspend fun setDefaultText(ctx: Context, color: Long) { ctx.dataStore.edit { it[DEFAULT_TEXT] = color } }
              suspend fun getThemeMode(ctx: Context): com.notebox.ui.theme.ThemeMode { return runCatching { com.notebox.ui.theme.ThemeMode.valueOf(ctx.dataStore.data.first()[THEME_MODE] ?: "STANDARD") }.getOrDefault(com.notebox.ui.theme.ThemeMode.STANDARD) }
              suspend fun setThemeMode(ctx: Context, mode: com.notebox.ui.theme.ThemeMode) { ctx.dataStore.edit { it[THEME_MODE] = mode.name } }
              private fun folderBg(f: String) = longPreferencesKey("folder_bg_${f}")
              private fun folderText(f: String) = longPreferencesKey("folder_text_${f}")
              suspend fun getFolderBg(ctx: Context, folder: String): Long? = ctx.dataStore.data.first()[folderBg(folder)]
              suspend fun getFolderText(ctx: Context, folder: String): Long? = ctx.dataStore.data.first()[folderText(folder)]
              private val WEBDAV_URL = stringPreferencesKey("webdav_url")
              private val WEBDAV_USER = stringPreferencesKey("webdav_user")
              private val WEBDAV_PASS = stringPreferencesKey("webdav_pass")
              data class WebDav(val url: String, val user: String, val pass: String)
              suspend fun getWebDav(ctx: Context): WebDav { val p = ctx.dataStore.data.first(); return WebDav(p[WEBDAV_URL] ?: "", p[WEBDAV_USER] ?: "", p[WEBDAV_PASS] ?: "") }
              suspend fun setWebDav(ctx: Context, url: String, user: String, pass: String) { ctx.dataStore.edit { it[WEBDAV_URL] = url; it[WEBDAV_USER] = user; it[WEBDAV_PASS] = pass } }
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/MainActivity.kt
          package com.notebox
          import android.app.Application
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.animation.*
          import androidx.compose.animation.core.tween
          import androidx.compose.runtime.*
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.lifecycleScope
          import com.notebox.data.Note
          import com.notebox.data.NoteDatabase
          import com.notebox.data.Prefs
          import com.notebox.ui.NoteEditScreen
          import com.notebox.ui.NoteListScreen
          import com.notebox.ui.SettingsScreen
          import com.notebox.ui.theme.NoteBoxTheme
          import com.notebox.ui.theme.ThemeMode
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          sealed class Screen { object List : Screen(); data class Edit(val note: Note?) : Screen(); object Settings : Screen() }
          class NoteViewModel(app: Application) : AndroidViewModel(app) {
              private val dao = NoteDatabase.get(app).noteDao()
              val notes = dao.observeAll().stateIn(viewModelScope, SharingStarted.Lazily, emptyList())
              fun save(note: Note) = viewModelScope.launch { dao.upsert(note) }
              fun delete(note: Note) = viewModelScope.launch { dao.delete(note) }
          }
          class MainActivity : ComponentActivity() {
              private val vm: NoteViewModel by viewModels()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var themeMode by remember { mutableStateOf(ThemeMode.STANDARD) }
                      LaunchedEffect(Unit) { themeMode = Prefs.getThemeMode(this@MainActivity) }
                      NoteBoxTheme(mode = themeMode) {
                          val notes by vm.notes.collectAsStateWithLifecycle()
                          var screen by remember { mutableStateOf<Screen>(Screen.List) }
                          AnimatedContent(targetState = screen, transitionSpec = {
                              val dur = 280
                              when {
                                  targetState is Screen.Edit && initialState is Screen.List -> (slideInHorizontally(tween(dur)) { it } + fadeIn(tween(dur))) togetherWith (slideOutHorizontally(tween(dur)) { -it / 3 } + fadeOut(tween(dur)))
                                  targetState is Screen.List && initialState is Screen.Edit -> (slideInHorizontally(tween(dur)) { -it / 3 } + fadeIn(tween(dur))) togetherWith (slideOutHorizontally(tween(dur)) { it } + fadeOut(tween(dur)))
                                  else -> fadeIn(tween(dur)) togetherWith fadeOut(tween(dur))
                              }
                          }, label = "screen") { s ->
                              when (s) {
                                  is Screen.List -> NoteListScreen(notes = notes, onNoteClick = { screen = Screen.Edit(it) }, onNewNote = { screen = Screen.Edit(null) }, onSettings = { screen = Screen.Settings })
                                  is Screen.Edit -> NoteEditScreen(initial = s.note, onSave = { vm.save(it) }, onDelete = { vm.delete(it) }, onBack = { screen = Screen.List })
                                  is Screen.Settings -> SettingsScreen(onBack = { screen = Screen.List }, currentMode = themeMode, onModeChange = { themeMode = it; lifecycleScope.launch { Prefs.setThemeMode(this@MainActivity, it) } })
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/ui/NoteListScreen.kt
          package com.notebox.ui
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.spring
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import com.notebox.data.Note
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun NoteListScreen(notes: List<Note>, onNoteClick: (Note) -> Unit, onNewNote: () -> Unit, onSettings: () -> Unit) {
              var filter by remember { mutableStateOf("All") }
              val folders = remember(notes) { listOf("All") + notes.map { it.folder }.distinct().sorted() }
              val visible = remember(notes, filter) { if (filter == "All") notes else notes.filter { it.folder == filter } }
              Scaffold(containerColor = MaterialTheme.colorScheme.background, topBar = { TopAppBar(title = { Text("~/notebox", style = MaterialTheme.typography.titleLarge) }, actions = { IconButton(onClick = onSettings) { Icon(Icons.Default.Settings, contentDescription = "Settings") } }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background)) }, floatingActionButton = { FloatingActionButton(onClick = onNewNote, containerColor = MaterialTheme.colorScheme.primary, contentColor = MaterialTheme.colorScheme.background) { Icon(Icons.Default.Add, contentDescription = "New") } }) { pad ->
                  Column(Modifier.padding(pad)) {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          folders.forEach { f -> FilterChip(selected = filter == f, onClick = { filter = f }, label = { Text(f, style = MaterialTheme.typography.labelSmall) }) }
                      }
                      if (visible.isEmpty()) { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("no notes yet", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.4f)) } } else {
                          LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(visible, key = { it.id }) { note -> NoteCard(note) { onNoteClick(note) } }
                          }
                      }
                  }
              }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun NoteCard(note: Note, onClick: () -> Unit) {
              Card(onClick = onClick, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline.copy(alpha = 0.25f)), modifier = Modifier.fillMaxWidth().animateItem(fadeInSpec = tween(220), fadeOutSpec = tween(220), placementSpec = spring(stiffness = Spring.StiffnessMediumLow))) {
                  Column(Modifier.padding(14.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          if (note.pinned) Text("📌 ", style = MaterialTheme.typography.titleLarge)
                          Text(text = note.title.ifBlank { "(untitled)" }, style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                      }
                      if (note.content.isNotBlank()) { Spacer(Modifier.height(4.dp)); Text(text = note.content, style = MaterialTheme.typography.bodyMedium, maxLines = 3, overflow = TextOverflow.Ellipsis) }
                      if (note.imagePath != null) { Spacer(Modifier.height(4.dp)); Text("📎 image", style = MaterialTheme.typography.labelSmall) }
                      Spacer(Modifier.height(6.dp))
                      Text(text = "${note.folder}  ·  ${java.text.SimpleDateFormat("MM-dd HH:mm", java.util.Locale.getDefault()).format(java.util.Date(note.updatedAt))}", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.4f))
                  }
              }
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/ui/NoteEditScreen.kt
          package com.notebox.ui
          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material.icons.filled.PushPin
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.rememberAsyncImagePainter
          import com.notebox.data.ImageStore
          import com.notebox.data.Note
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun NoteEditScreen(initial: Note?, onSave: (Note) -> Unit, onDelete: (Note) -> Unit, onBack: () -> Unit) {
              val context = LocalContext.current
              var title by remember { mutableStateOf(initial?.title ?: "") }
              var content by remember { mutableStateOf(initial?.content ?: "") }
              var folder by remember { mutableStateOf(initial?.folder ?: "Inbox") }
              var imageFile by remember { mutableStateOf(initial?.imagePath?.let { ImageStore.resolve(context, it) }) }
              var bgColor by remember { mutableStateOf(initial?.customBgColor) }
              var textColor by remember { mutableStateOf(initial?.customTextColor) }
              var fontScale by remember { mutableStateOf(initial?.widgetFontScale ?: 1.0f) }
              var pinned by remember { mutableStateOf(initial?.pinned ?: false) }
              var showAppearance by remember { mutableStateOf(false) }
              val picker = rememberLauncherForActivityResult(contract = ActivityResultContracts.PickVisualMedia(), onResult = { uri: Uri? -> uri ?: return@rememberLauncherForActivityResult; ImageStore.save(context, uri)?.let { imageFile = ImageStore.resolve(context, it) } })
              fun build(): Note = (initial ?: Note()).copy(title = title.trim(), content = content, folder = folder, imagePath = imageFile?.name, customBgColor = bgColor, customTextColor = textColor, widgetFontScale = fontScale, pinned = pinned, updatedAt = System.currentTimeMillis())
              Scaffold(containerColor = MaterialTheme.colorScheme.background, topBar = {
                  TopAppBar(title = { Text(":note", style = MaterialTheme.typography.titleLarge) }, navigationIcon = { IconButton(onClick = { onSave(build()); onBack() }) { Icon(Icons.Default.ArrowBack, contentDescription = "Save") } }, actions = {
                      if (initial != null) IconButton(onClick = { onDelete(initial); onBack() }) { Icon(Icons.Default.Delete, contentDescription = "Delete") }
                      IconButton(onClick = { pinned = !pinned }) { Icon(Icons.Default.PushPin, contentDescription = "Pin to widget", tint = if (pinned) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.4f)) }
                      TextButton(onClick = { onSave(build()); onBack() }) { Text(":wq") }
                  }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background))
              }) { pad ->
                  Column(Modifier.padding(pad).fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                      Box(Modifier.fillMaxWidth().border(BorderStroke(1.dp, MaterialTheme.colorScheme.outline.copy(alpha = 0.5f)), shape = MaterialTheme.shapes.medium).background(MaterialTheme.colorScheme.surface, shape = MaterialTheme.shapes.medium).padding(16.dp)) {
                          Column {
                              BasicTextField(value = title, onValueChange = { title = it }, textStyle = TextStyle(fontFamily = androidx.compose.ui.text.font.FontFamily.Monospace, fontWeight = FontWeight.Bold, fontSize = 20.sp, color = MaterialTheme.colorScheme.onSurface), cursorBrush = SolidColor(MaterialTheme.colorScheme.primary), decorationBox = { inner -> Box { if (title.isEmpty()) Text("title", style = MaterialTheme.typography.titleLarge.copy(color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.3f))); inner() } }, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(8.dp))
                              HorizontalDivider(color = MaterialTheme.colorScheme.outline.copy(alpha = 0.25f))
                              Spacer(Modifier.height(8.dp))
                              BasicTextField(value = content, onValueChange = { content = it }, textStyle = TextStyle(fontFamily = androidx.compose.ui.text.font.FontFamily.Monospace, fontSize = 15.sp, lineHeight = 22.sp, color = MaterialTheme.colorScheme.onSurface), cursorBrush = SolidColor(MaterialTheme.colorScheme.primary), decorationBox = { inner -> Box { if (content.isEmpty()) Text("start writing...", style = MaterialTheme.typography.bodyLarge.copy(color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.3f))); inner() } }, modifier = Modifier.fillMaxWidth().heightIn(min = 240.dp))
                          }
                      }
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(value = folder, onValueChange = { folder = it }, label = { Text("folder") }, singleLine = true, modifier = Modifier.weight(1f))
                          OutlinedButton(onClick = { picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly)) }) { Text("📎") }
                          if (imageFile != null) OutlinedButton(onClick = { imageFile = null }) { Text("✕") }
                      }
                      imageFile?.let { f -> if (f.exists()) Image(painter = rememberAsyncImagePainter(f), contentDescription = null, modifier = Modifier.fillMaxWidth().height(200.dp)) }
                      TextButton(onClick = { showAppearance = !showAppearance }) { Text(if (showAppearance) "▲ appearance" else "▼ appearance") }
                      if (showAppearance) {
                          Text("background", style = MaterialTheme.typography.labelSmall)
                          ColorRow(bgColor) { bgColor = it }
                          Text("text", style = MaterialTheme.typography.labelSmall)
                          ColorRow(textColor) { textColor = it }
                          Text("font scale: %.2f×".format(fontScale), style = MaterialTheme.typography.labelSmall)
                          Slider(value = fontScale, onValueChange = { fontScale = it }, valueRange = 0.7f..1.6f)
                      }
                      Spacer(Modifier.height(24.dp))
                  }
              }
          }
          private val Palette = listOf(null, 0xFF000000, 0xFF0A0A0A, 0xFF272822, 0xFF1E1E2E, 0xFF2B213A, 0xFFA6E22E, 0xFFB4BEFE, 0xFF66D9EF, 0xFFF92672, 0xFFFD971F, 0xFFF8F8F2, 0xFFCDD6F4, 0xFFFFFFFF)
          @Composable
          private fun ColorRow(selected: Long?, onPick: (Long?) -> Unit) {
              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.padding(vertical = 4.dp)) {
                  Palette.forEach { c -> Box(Modifier.size(28.dp).background(if (c == null) Color.Transparent else Color(c)).border(width = if (selected == c) 2.dp else 1.dp, color = if (selected == c) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outline.copy(alpha = 0.4f)).clickable { onPick(c) }, contentAlignment = Alignment.Center) { if (c == null) Text("∅", style = MaterialTheme.typography.labelSmall) } }
              }
          }
          EOF

          cat << 'EOF' | sed 's/^ *//' > app/src/main/java/com/notebox/ui/SettingsScreen.kt
          package com.notebox.ui
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.notebox.data.Prefs
          import com.notebox.sync.BackupManager
          import com.notebox.sync.WebDavClient
          import com.notebox.ui.theme.ThemeMode
          import kotlinx.coroutines.launch
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SettingsScreen(onBack: () -> Unit, currentMode: ThemeMode, onModeChange: (ThemeMode) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var status by remember { mutableStateOf("") }
              var defaultBg by remember { mutableStateOf(0xFF272822L) }
              var defaultText by remember { mutableStateOf(0xFFF8F8F2L) }
              LaunchedEffect(Unit) { defaultBg = Prefs.getDefaultBg(ctx); defaultText = Prefs.getDefaultText(ctx) }
              var davUrl by remember { mutableStateOf("") }
              var davUser by remember { mutableStateOf("") }
              var davPass by remember { mutableStateOf("") }
              LaunchedEffect(Unit) { val c = Prefs.getWebDav(ctx); davUrl = c.url; davUser = c.user; davPass = c.pass }
              Scaffold(containerColor = MaterialTheme.colorScheme.background, topBar = { TopAppBar(title = { Text("~/settings") }, navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = "Back") } }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background)) }) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Text("theme", style = MaterialTheme.typography.titleLarge)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          ThemeMode.entries.forEach { m -> FilterChip(selected = currentMode == m, onClick = { onModeChange(m) }, label = { Text(m.name, style = MaterialTheme.typography.labelSmall) }) }
                      }
                      HorizontalDivider()
                      Text("default widget colors", style = MaterialTheme.typography.titleLarge)
                      Text("background", style = MaterialTheme.typography.labelSmall)
                      Swatches(defaultBg) { defaultBg = it; scope.launch { Prefs.setDefaultBg(ctx, it) } }
                      Text("text", style = MaterialTheme.typography.labelSmall)
                      Swatches(defaultText) { defaultText = it; scope.launch { Prefs.setDefaultText(ctx, it) } }
                      HorizontalDivider()
                      Text("backup", style = MaterialTheme.typography.titleLarge)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { scope.launch { status = BackupManager.backupNow(ctx)?.let { "saved: ${it.name}" } ?: "backup failed" } }) { Text("backup now") }
                          OutlinedButton(onClick = { scope.launch { status = BackupManager.restoreLatest(ctx)?.let { "restored $it notes" } ?: "no backups" } }) { Text("restore latest") }
                      }
                      HorizontalDivider()
                      Text("WebDAV cloud sync", style = MaterialTheme.typography.titleLarge)
                      OutlinedTextField(davUrl, { davUrl = it }, label = { Text("server URL") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(davUser, { davUser = it }, label = { Text("username") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(davPass, { davPass = it }, label = { Text("password") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { scope.launch { Prefs.setWebDav(ctx, davUrl, davUser, davPass); status = "webdav saved" } }) { Text("save") }
                          Button(onClick = { scope.launch { Prefs.setWebDav(ctx, davUrl, davUser, davPass); val c = WebDavClient(davUrl, davUser, davPass); status = if (c.uploadLatest(ctx)) "uploaded ✓" else "upload failed" } }) { Text("upload") }
                          OutlinedButton(onClick = { scope.launch { val c = WebDavClient(davUrl, davUser, davPass); status = if (c.downloadLatest(ctx)) "downloaded ✓" else "download failed" } }) { Text("download") }
                      }
                      if (status.isNotBlank()) Text("status: $status", style = MaterialTheme.typography.labelSmall)
                      Spacer(Modifier.height(24.dp))
                  }
              }
          }
          private val SwatchSet = listOf(0xFF000000L, 0xFF0A0A0AL, 0xFF272822L, 0xFF1E1E2EL, 0xFF2B213AL, 0xFFA6E22EL, 0xFFB4BEFEL, 0xFF66D9EFL, 0xFFF92672L, 0xFFFD971FL, 0xFFF8F8F2L, 0xFFCDD6F4L, 0xFFFFFFFFL)
          @Composable
          private fun Swatches(selected: Long, onPick: (Long) -> Unit) {
              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  SwatchSet.forEach { c -> Box(Modifier.size(28.dp).background(Color(c)).border(if (selected == c) 2.dp else 1.dp, if (selected == c) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outline.copy(alpha = 0.4f)).clickable { onPick(c) }) }
              }
          }
